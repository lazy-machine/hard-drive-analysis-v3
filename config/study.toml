# The study contract: every rule that more than one step must agree on lives here, and
# only here. Steps that depend on it list this file as an input, so editing it reruns
# exactly those steps (data-pipeline content-hash checkpoints).
#
# Which drives to sample, and how densely, is in sample.toml. Model hyperparameters are
# in pipeline.toml, one step per model.

[data]
# Boot SSDs share the panel with the HDDs. They are a different failure population.
ssd_model_pattern = 'SSD|^CT\d+MX|DELLBOSS|WDS\d|SA510|ZA\d+(?:CM|NM|GM)|MTFD|SSDSC|Micron'

[split]
# Drives are split by a stable sha256 bucket of the serial number (0-99), so no drive is in
# more than one split. On top of that the split is temporal: train/val rows stop at
# train_end, and test snapshots start at test_start.
train_buckets = [0, 70]   # [lo, hi)
val_buckets = [70, 80]    # early stopping, calibration and alert-threshold selection
test_buckets = [80, 100]
train_end = "2023-12-31"
test_start = "2024-01-01"
# Validation drives are split again by a stable hash: this share calibrates the
# probabilities and sets the alert threshold, the rest only drives early stopping, so the
# calibration is not fitted on the rows that chose the number of trees.
calibration_share = 0.5
# The *_recent calibration is refitted on validation snapshots from the last this many
# days before train_end, to test whether recent failure rates explain the test-year drift.
recent_days = 365

[label]
# Discrete-time survival: the future after each snapshot is cut into these bins (days).
# The hazard model predicts P(fail in bin | alive at bin start). Survival is the product.
bin_edges = [0, 7, 14, 30, 60, 90, 180, 365]
# Horizons reported by evaluation. Each must be a bin edge.
horizons = [7, 30, 90, 180, 365]
# The yes/no baseline classifier answers "fails within this many days?".
binary_horizon = 30

[features]
# SMART attributes read from the panel, as raw values. VARCHAR columns are cast to DOUBLE.
raw = [4, 5, 9, 10, 12, 22, 183, 184, 187, 189, 190, 191, 192, 193,
       194, 196, 197, 198, 199, 200, 240, 241, 242]
# Attributes whose raw value is vendor-packed or a placeholder: the normalized value is used
# instead. 23 and 24 (mostly Toshiba) report raw = 0 in all 129.7M rows, but the normalized
# value leaves 100 on a few drives (100 of 117,848; 51 of them failed). 18 (Seagate ST...G)
# is 0 raw and 100 normalized in all 131.8M rows, so it carries nothing and is not a feature.
# 188 (command timeout): Seagate packs several 16-bit fields into the raw value (2.9% of
# Seagate snapshots are >= 65536, up to 3.4e12), and the other vendors report it as NULL.
normalized = [1, 3, 5, 7, 23, 24, 187, 188, 197, 198]
# Raw values that keep only their low bits. Seagate's 240 (head flying hours) carries a
# milliseconds field above bit 32 (smartctl's msec24hour32 format): 1.1% of Seagate
# snapshots are >= 2^32, against a maximum of 75,184 hours on the other vendors.
raw_low_bits = { smart_240_raw = 32 }
# Columns that get "change over the last N days" features (date-keyed windows, not rows).
trend = ["smart_1_normalized", "smart_5_raw", "smart_7_normalized", "smart_10_raw",
         "smart_183_raw", "smart_184_raw", "smart_187_raw", "smart_189_raw",
         "smart_193_raw", "smart_197_raw", "smart_198_raw", "smart_199_raw"]
trend_windows = [7, 30]
# The most common drive models (counted over train drives only) become categorical
# levels. Everything else is "other".
top_models = 30
# The counters behind the classic "any reallocated/pending/uncorrectable sector" rule.
# Used by the rule baseline, the silent-failure slice and the hazard_nocritical ablation.
# 188 is left out: its packed Seagate raw values took 89% of the rule's false-alarm budget.
critical_counters = ["smart_5_raw", "smart_187_raw", "smart_197_raw", "smart_198_raw"]

[evaluation]
# The alert threshold is chosen on validation drives so that this fraction of healthy
# drive-days raises an alert (a false-alarm budget). It is never tuned on test.
alert_false_alarm_rate = 0.01
# Further budgets reported next to it: production systems in the literature run at 0.1-0.3%
# (at a 0.12% base rate, a 1% budget caps precision near 11% even with perfect recall).
alert_false_alarm_rates = [0.001, 0.003, 0.01]
# A failure counts as detected early only if an alert came at least this many days before
# it, and the "lead" slice drops positives closer to failure than this (the last days'
# SMART values may already show the breakdown the operator acted on).
min_lead_days = 7
# Capacity slice: training saw few large drives (>= 16 TB is ~10% of train weight, ~50% of
# test weight), so results are also reported for each side of this size.
capacity_split_tb = 16
# Drive-level (cluster) bootstrap for confidence intervals.
bootstrap_rounds = 200
bootstrap_seed = 20261021
# Harrell's and Uno's C are slower (a Fenwick tree per round), so they get fewer rounds.
concordance_bootstrap_rounds = 50
# Fewer failing drives than this in a split makes its metrics too noisy to trust (the
# gate warns). At 30 failures a 30-day ROC-AUC interval is already about +-0.1 wide.
min_failing_drives = 30
