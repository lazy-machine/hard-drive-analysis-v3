watch = ["steps/common.py", "steps/model.py", "steps/survival.py", "steps/engines.py"]

# Ensembles: the mean of the members' calibrated per-bin hazards.
[steps.params.ensembles]
ens_trees = ["hazard_smart", "xgb_hazard", "catboost_hazard"]
ens_trees_mlp = ["hazard_smart", "xgb_hazard", "catboost_hazard", "torch_mlp"]
ens_lgbm_mlp = ["hazard_smart", "torch_mlp"]
ens_mlp_seeds = ["torch_mlp", "torch_mlp_s43", "torch_mlp_s44"]

[[steps]]
name = "evaluate"
description = "Weighted, censoring-aware metrics with drive-level bootstrap intervals"
function = "evaluate:evaluate"
inputs = { predictions = "build/predictions.parquet", cohort = "build/cohort.parquet", study = "config/study.toml" }
outputs = { metrics = "build/metrics.json", calibration = "build/calibration.csv", detection = "build/detection.csv", life = "build/life.csv" }
params = { reference = "hazard_smart", concordance_max_rows = 300000 }
requires = ["numpy", "pandas>=2.2"]
watch = ["steps/common.py", "steps/metrics.py", "steps/survival.py"]

# timing_tolerance: the answer calls the predicted failure days "about right" when the
# mean miss over the 10/50/90% days, each scaled by the largest miss possible for its
# target, is within this value; otherwise it says too pessimistic or too optimistic.
# labels: the display name of each model in the report's text, tables and figures. A model
# without a label is shown under its own name (hazard_smart, rule_counters, ...).

[[steps]]
name = "report"
description = "Headline numbers (build/report/results.md) and the detailed analysis with figures (build/report/analysis.md)"
function = "report:report"
inputs = { metrics = "build/metrics.json", calibration = "build/calibration.csv", detection = "build/detection.csv", life = "build/life.csv", predictions = "build/predictions.parquet", cohort_summary = "build/cohort-summary.json", verify = "build/verify-report.json", explore = "build/explore", meta_hazard_smart = "build/models/hazard_smart.json" }
outputs = { dir = "build/report" }
requires = ["matplotlib", "pandas>=2.2"]

[steps.params]
timing_tolerance = 0.15

[steps.params.labels]
hazard_smart = "survival model, SMART + context"
hazard_nosmart = "survival model, context only (no SMART)"
binary_30d = "30-day yes/no classifier (SMART + context)"
rule_counters = "rule: critical SMART counters (5, 187, 197, 198)"
hazard_nocritical = "survival model, SMART without counters 5/187/188/197/198"
hazard_usage = "survival model, context + usage counters"
hazard_smart_w075 = "survival model, SMART + context, weight power 0.75"
hazard_smart_w100 = "survival model, SMART + context, weight power 1.0"
hazard_smart_recent = "survival model, SMART + context, recalibrated on the last year"
xgb_hazard = "engine: XGBoost hazard"
xgb_aft = "engine: XGBoost AFT (log-normal)"
catboost_hazard = "engine: CatBoost hazard"
torch_mlp = "engine: neural hazard (MLP)"
torch_linear = "engine: linear logistic hazard"
torch_gru = "engine: neural hazard, MLP + GRU over 30 daily readings"
torch_gru_raw = "engine: GRU over raw daily readings + context only"
torch_mlp_s43 = "engine: neural hazard (MLP), seed 43"
torch_mlp_s44 = "engine: neural hazard (MLP), seed 44"
hazard_smart_big = "survival model, SMART + context, 127 leaves"
ens_trees = "ensemble: LightGBM + XGBoost + CatBoost"
ens_mlp_seeds = "ensemble: MLP, three seeds"
ens_trees_mlp = "ensemble: the three tree engines + MLP"
ens_lgbm_mlp = "ensemble: LightGBM + MLP"

# Engines compared in the report's "Prediction engines" section, with what each tests.
[steps.params.engines]
xgb_hazard = "XGBoost's histogram trees on the same person-period rows, with matched capacity (31 leaves, learning rate 0.03, row and column subsampling 0.8); missing values coded below every real value (steps/engines.py). Tests whether the results are specific to LightGBM."
catboost_hazard = "CatBoost's oblivious (symmetric) trees, depth 6, learning rate 0.1, on the same rows; model and vendor one-hot (target statistics took twice as long per tree). A differently regularised tree learner."
xgb_aft = "XGBoost's accelerated failure time objective on the snapshots themselves (7.6M rows instead of 48M person-period rows): log T = f(x) + 1.7 Z, Z standard normal (a log-normal time; normal with scale 1.7 had the best validation likelihood of normal, logistic and minimum-Gumbel errors at scales 0.5-3 on the small scale). The only engine whose survival curve has a fixed parametric shape."
torch_mlp = "a neural network on the GPU (3 hidden layers of 512/256/128, signed-log scaled inputs with missing-value flags, embeddings for model and vendor) with one output per bin, trained on the snapshots with a mask of the bins each is at risk in. Same likelihood as the person-period rows without building them."
torch_linear = "the textbook discrete-time model: one linear score shared by every bin plus a per-bin intercept (proportional odds), on the same scaled inputs. Shows how much the trees and the network add over a linear hazard."
torch_gru = "the MLP plus a GRU (64 units) over each snapshot's last 30 daily readings of all 34 SMART columns, with the days before the snapshot and a real-row flag per step. Tests whether the raw daily history holds signal that the 7- and 30-day trend features miss."
torch_gru_raw = "the GRU over the last 30 daily readings with only the context features (model, capacity, age) beside it: no snapshot SMART values and no hand-made trends. Can the network find in the raw history what the features encode?"
hazard_smart_big = "the reference LightGBM model with four times the leaves (127, min 100 rows per leaf). Tests whether the reference underfits."
torch_mlp_s43 = "the MLP with seed 43 (initialisation and batch order). With seed 44, shows how much the network's numbers move from training noise alone."
torch_mlp_s44 = "the MLP with seed 44."
ens_mlp_seeds = "mean of the three MLP seeds."
ens_trees = "mean of the LightGBM, XGBoost and CatBoost hazards per bin."
ens_trees_mlp = "the same plus the neural network."
ens_lgbm_mlp = "LightGBM and the neural network only: trees and a network make different errors."
