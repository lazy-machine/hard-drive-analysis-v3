<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .caixa { fill: #f2f2f2; stroke: #333; stroke-width: 1.2; }
      .portao { fill: #fff4d6; stroke: #333; stroke-width: 1.2; }
      .modelo { fill: #e3eefb; stroke: #333; stroke-width: 1.2; }
      .linha { stroke: #333; stroke-width: 1.3; fill: none; marker-end: url(#seta); }
      .nome { font-weight: bold; text-anchor: middle; }
      .desc { text-anchor: middle; font-size: 10.5px; fill: #444; }
    </style>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>

  <!-- linha 1: dados -->
  <rect class="caixa" x="10" y="20" width="120" height="58" rx="4"/>
  <text class="nome" x="70" y="44">painel Parquet</text>
  <text class="desc" x="70" y="62">linhas diárias</text>

  <rect class="caixa" x="165" y="20" width="135" height="58" rx="4"/>
  <text class="nome" x="232" y="44">drive_index</text>
  <text class="desc" x="232" y="62">uma linha por disco</text>

  <rect class="caixa" x="335" y="20" width="135" height="58" rx="4"/>
  <text class="nome" x="402" y="44">cohort</text>
  <text class="desc" x="402" y="62">divisão e pesos</text>

  <rect class="caixa" x="505" y="20" width="135" height="58" rx="4"/>
  <text class="nome" x="572" y="44">extract</text>
  <text class="desc" x="572" y="62">linhas da coorte</text>

  <rect class="caixa" x="675" y="20" width="135" height="58" rx="4"/>
  <text class="nome" x="742" y="44">snapshots</text>
  <text class="desc" x="742" y="62">variáveis e rótulos</text>

  <rect class="portao" x="835" y="20" width="115" height="58" rx="4"/>
  <text class="nome" x="892" y="40">verify</text>
  <text class="desc" x="892" y="57">56 verificações</text>
  <text class="desc" x="892" y="70">aplicáveis</text>

  <path class="linha" d="M130,49 H163"/>
  <path class="linha" d="M300,49 H333"/>
  <path class="linha" d="M470,49 H503"/>
  <path class="linha" d="M640,49 H673"/>
  <path class="linha" d="M810,49 H833"/>

  <!-- ramificação a partir do portão -->
  <path class="linha" d="M892,78 V110 H100 V138"/>
  <path class="linha" d="M560,110 V138"/>

  <!-- linha 2: exploração e modelos -->
  <rect class="caixa" x="20" y="140" width="160" height="58" rx="4"/>
  <text class="nome" x="100" y="164">explore</text>
  <text class="desc" x="100" y="182">análise exploratória</text>

  <rect class="modelo" x="400" y="140" width="320" height="58" rx="4"/>
  <text class="nome" x="560" y="164">train_* (19 modelos)</text>
  <text class="desc" x="560" y="182">sobrevivência, classificador, ablações, sementes</text>


  <!-- linha 3: previsão, avaliação, relatório -->
  <path class="linha" d="M495,198 V238"/>
  <rect class="caixa" x="430" y="240" width="130" height="58" rx="4"/>
  <text class="nome" x="495" y="264">predict</text>
  <text class="desc" x="495" y="282">curvas de risco</text>

  <rect class="caixa" x="595" y="240" width="150" height="58" rx="4"/>
  <text class="nome" x="670" y="264">evaluate</text>
  <text class="desc" x="670" y="282">métricas e intervalos</text>

  <rect class="caixa" x="780" y="240" width="170" height="58" rx="4"/>
  <text class="nome" x="865" y="264">report</text>
  <text class="desc" x="865" y="282">tabelas e figuras</text>

  <path class="linha" d="M560,269 H593"/>
  <path class="linha" d="M745,269 H778"/>
</svg>
