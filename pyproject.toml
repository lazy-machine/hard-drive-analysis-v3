[project]
name = "hard-drive-analysis"
version = "3.0.0"
description = "Can smartctl (SMART) metrics predict how much life a hard drive has left?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "data-pipeline",
    "data-verify",
    "duckdb>=2.0",
    "lightgbm>=4.6",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "pyarrow>=20",
    "scikit-learn>=1.6",
    "scipy>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.uv.sources]
data-pipeline = { path = "../data-pipeline", editable = true }
data-verify = { path = "../data-verify", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["steps"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# No "I" (isort): the imports are sorted and grouped, but ruff's isort would rewrite every
# wrapped multi-name import as one name per line.
select = ["E", "F", "W", "B", "UP"]
