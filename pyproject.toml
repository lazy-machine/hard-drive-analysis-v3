[project]
name = "hard-drive-analysis"
version = "3.0.0"
description = "Can smartctl (SMART) metrics predict how much life a hard drive has left?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "data-pipeline",
    "data-verify",
    "duckdb>=2.0",
    "lightgbm>=4.6",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "pyarrow>=20",
    "scikit-learn>=1.6",
    "scipy>=1.18",
    # alternative prediction engines (steps/engines.py)
    "catboost>=1.2.10",
    "torch>=2.15",
    "xgboost>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.uv]
package = false
# The ROCm torch wheels exist for Linux x86_64 only, which is what this fork targets.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
data-pipeline = { path = "../data-pipeline", editable = true }
data-verify = { path = "../data-verify", editable = true }
# ROCm builds of PyTorch (the AMD GPU is the "cuda" device).
torch = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm10.0"
# Not explicit: torch's ROCm runtime packages (rocm, rocm-sdk-*, triton-rocm) exist only
# on this index, and uv applies `sources` to direct dependencies only. Packages this index
# also mirrors (numpy, pillow, ...) then resolve from it, with the same files as PyPI.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["steps"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# No "I" (isort): the imports are sorted and grouped, but ruff's isort would rewrite every
# wrapped multi-name import as one name per line.
select = ["E", "F", "W", "B", "UP"]
