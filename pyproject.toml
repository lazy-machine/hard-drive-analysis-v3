[project]
name = "hard-drive-analysis"
version = "3.0.0"
description = "Can smartctl (SMART) metrics predict how much life a hard drive has left?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "data-pipeline[verify]",
    "duckdb>=2.0",
    "lightgbm>=4.6",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "pyarrow>=20",
    "scikit-learn>=1.6",
    "scipy>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

# Experimental: engines for the block arena (arena/README.md).
arena = [
    "catboost>=1.2",
    "numba>=0.62",
    "torch>=2.12",
    "triton-rocm",
    "xgboost>=3.0",
]

[tool.uv]
package = false
default-groups = ["dev", "arena"]
# ROCm wheels: Linux x86_64, CPython 3.13 is the interpreter this branch runs on.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'"]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
data-pipeline = { path = "../data-pipeline", editable = true }
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["steps"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# No "I" (isort): the imports are sorted and grouped, but ruff's isort would rewrite every
# wrapped multi-name import as one name per line.
select = ["E", "F", "W", "B", "UP"]
